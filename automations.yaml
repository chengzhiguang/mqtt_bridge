# --- 4: 查询场景列表 ---
- alias: MQTT查询场景列表
  mode: queued
  trigger:
    - platform: mqtt
      topic: iot/server/D69512C45225/command
  condition: "{{ trigger.payload_json.type == 'command' and trigger.payload_json.cmd == 'list_scenes' }}"
  action:
    - service: shell_command.scene_list
      data:
        trace_id: "{{ trigger.payload_json.traceId | default('') }}"

# --- 5: 激活场景 ---
- alias: MQTT激活场景
  mode: queued
  trigger:
    - platform: mqtt
      topic: iot/server/D69512C45225/command
  condition: "{{ trigger.payload_json.type == 'command' and trigger.payload_json.cmd == 'activate_scene' }}"
  action:
    - choose:
        - conditions: "{{ trigger.payload_json.data.entity_id in states.scene | map(attribute='entity_id') | list }}"
          sequence:
            - service: scene.turn_on
              target:
                entity_id: "{{ trigger.payload_json.data.entity_id }}"
            - service: mqtt.publish
              data:
                topic: iot/device/D69512C45225/notify
                qos: 2
                payload: |
                  {"traceId":"{{ trigger.payload_json.traceId | default('') }}","cmd":"activate_scene","type":"notify","time":{{ now().timestamp() | int }},"data":{"status":"ok","scene":"{{ trigger.payload_json.data.entity_id }}"}}
      default:
        - service: mqtt.publish
          data:
            topic: iot/device/D69512C45225/notify
            qos: 2
            payload: |
              {"traceId":"{{ trigger.payload_json.traceId | default('') }}","cmd":"activate_scene","type":"notify","time":{{ now().timestamp() | int }},"data":{"status":"error","message":"场景不存在或已停用"}}

# --- 6: 创建场景 ---
- alias: MQTT创建场景
  mode: queued
  trigger:
    - platform: mqtt
      topic: iot/server/D69512C45225/command
  condition: "{{ trigger.payload_json.type == 'command' and trigger.payload_json.cmd == 'create_scene' }}"
  action:
    - service: shell_command.scene_create
      data:
        scene_json_b64: "{{ trigger.payload_json.data | to_json | base64_encode }}"
    - delay:
        seconds: 1
    - service: homeassistant.reload_core_config
    - delay:
        seconds: 1
    - service: scene.reload
    - service: mqtt.publish
      data:
        topic: iot/device/D69512C45225/notify
        qos: 2
        payload: |
          {"traceId":"{{ trigger.payload_json.traceId | default('') }}","cmd":"create_scene","type":"notify","time":{{ now().timestamp() | int }},"data":{"status":"ok"}}

